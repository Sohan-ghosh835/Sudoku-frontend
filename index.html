<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/favicon.jpg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.jpg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="SudoBunny" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>SudoBunny</title>
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute;overflow:hidden">
      <defs>
        <filter id="crumpleFilterCoarse" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.0018 0.0032" numOctaves="3" seed="7" result="noise"/>
          <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="22" diffuseConstant="1.4" result="lit">
            <feDistantLight azimuth="235" elevation="34"/>
          </feDiffuseLighting>
        </filter>
      </defs>
    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
